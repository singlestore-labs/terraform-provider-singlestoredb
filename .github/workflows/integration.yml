name: Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # This is used to check that Management API hasn't changed in a way that breaks the provider
    - cron: '0 3 * * *' # Runs every day at 3:00 AM UTC.
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup go
      uses: actions/setup-go@v2
      with:
        go-version: '1.26'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Install make
      run: sudo apt-get install make -y

    - name: Configure Terraform
      run: |
        # This replaces the $HOME variable with the appropriate value.
        envsubst < .terraformrc_template > ~/.terraformrc

    - name: Build
      run: make

    - name: Run integration tests
      env:
        TEST_SINGLESTOREDB_API_KEY: ${{ secrets.TEST_SINGLESTOREDB_API_KEY }}
      run: make integration

    # Tokenless uploads are rate-limited (about one per 25 minutes). CODECOV_TOKEN
    # skips the limit. Retry once after the window instead of immediately.
    - name: Upload coverage to Codecov
      id: codecov
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Wait out a Codecov rate limit
      if: steps.codecov.outcome == 'failure'
      run: sleep 1800

    - name: Retry Codecov upload
      if: steps.codecov.outcome == 'failure'
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
