name: Unit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    environment: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup go
      uses: actions/setup-go@v2
      with:
        go-version: '1.26'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Install make
      run: sudo apt-get install make -y

    - name: Configure Terraform
      run: |
        # This replaces the $HOME variable with the appropriate value.
        envsubst < .terraformrc_template > ~/.terraformrc

    - name: Install tools
      run: make tools

    - name: Build
      run: make

    - name: Generate
      run: make generate

    - name: Run fmt
      run: make format

    - name: Run gencheck
      run: make gencheck

    - name: Run lint
      run: make lint

    - name: Run unit tests
      run: make unit

    # Tokenless uploads are rate-limited (about one per 25 minutes). A failed upload
    # used to exit 0, so Codecov kept only the integration profile and reported
    # unit-tested code as uncovered. CODECOV_TOKEN skips the limit. Retry once
    # after the window instead of immediately, so an early retry does not extend it.
    - name: Upload coverage to Codecov
      id: codecov
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Wait out a Codecov rate limit
      if: steps.codecov.outcome == 'failure'
      run: sleep 1800

    - name: Retry Codecov upload
      if: steps.codecov.outcome == 'failure'
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
